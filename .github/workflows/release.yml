name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Sora version, independent of upstream tags
        type: string
        required: true
        default: 0.0.0
      publish:
        description: Publish a GitHub release after building and signing
        type: boolean
        default: false
      publish_npm:
        description: Also publish @satslab/sora through npm trusted publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sora-release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
      - name: Validate version and release options
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          PUBLISH_NPM: ${{ inputs.publish_npm }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use an exact stable version, such as 0.0.0.' >&2; exit 1; }
          [[ "$PUBLISH_NPM" != true || "$PUBLISH" == true ]] || { echo 'npm publication requires GitHub publication.' >&2; exit 1; }
          if [[ "$PUBLISH" == true ]]; then
            # Never replace a published version or an inherited tag.
            status=0
            git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" || status=$?
            [[ "$status" == 2 ]] || { echo 'The tag exists or the remote could not be checked.' >&2; exit 1; }
          fi
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  bundle:
    needs: [metadata, quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Install build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Load T3 Connect public configuration
        run: cp .env.example .env
      - name: Set Sora version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"
      - name: Build shared JavaScript bundles
        env:
          SORA_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error

  linux:
    needs: [metadata, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps
      - uses: ./.github/actions/release-build
        with:
          platform: linux
          arch: x64
          rust-target: x86_64-unknown-linux-gnu
          version: ${{ needs.metadata.outputs.version }}
      - name: Verify Linux CLI
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/smoke-cli-archive.ts --archive "release-cli/sora-$VERSION-linux-x64.tar.gz" --expect-version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: release-cli/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error

  cross_build:
    needs: [metadata, bundle, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            rust-target: aarch64-apple-darwin
          - platform: win
            arch: x64
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps
      - uses: actions/download-artifact@v8
        if: matrix.platform == 'win'
        with:
          name: cli-linux
          path: wsl-runtime
      - uses: ./.github/actions/release-build
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          rust-target: ${{ matrix.rust-target }}
          version: ${{ needs.metadata.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform == 'mac' && 'mac-unsigned' || 'desktop-win' }}
          path: |
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform == 'mac' && 'cli-mac-unsigned' || 'cli-win' }}
          path: release-cli/*
          if-no-files-found: error

  sign_mac:
    needs: [metadata, cross_build]
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v8
        with:
          name: mac-unsigned
          path: mac-input
      - uses: actions/download-artifact@v8
        with:
          name: cli-mac-unsigned
          path: mac-input
      - name: Set packaging version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"
      - name: Sign and notarize existing macOS binaries
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          REQUIRE_DEVELOPER_ID: ${{ inputs.publish }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: node scripts/finalize-macos-release.mjs
      - name: Verify signed CLI
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/smoke-cli-archive.ts --archive "release/sora-$VERSION-darwin-arm64.tar.gz" --expect-version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-signed
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.tar.gz
            release/latest-mac.yml
          if-no-files-found: error

  verify_windows:
    needs: [metadata, cross_build]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v8
        with:
          name: cli-win
          path: release-cli
      - name: Verify cross-built CLI on Windows
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/smoke-cli-archive.ts --archive "release-cli/sora-$VERSION-win32-x64.zip" --expect-version "$VERSION"

  publish:
    needs: [metadata, linux, sign_mac, verify_windows]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli-assets
      - uses: actions/download-artifact@v8
        with:
          name: mac-signed
          path: release
      - name: Publish Sora release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cp "cli-assets/sora-$VERSION-linux-x64.tar.gz" "cli-assets/sora-$VERSION-win32-x64.zip" release/
          cd release
          sha256sum sora-*.tar.gz sora-*.zip > SHA256SUMS
          gh release create "v$VERSION" --repo "$RELEASE_REPOSITORY" --target "$RELEASE_COMMIT" --title "Sora $VERSION" --notes "Sora $VERSION" --draft ./*
          gh release edit "v$VERSION" --repo "$RELEASE_REPOSITORY" --draft=false --latest

  publish_npm:
    needs: [metadata, publish]
    if: inputs.publish_npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Build and publish npm launcher
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node scripts/build-npm-launcher.ts --version "$VERSION" --output-dir npm-packages
          node apps/server/scripts/cli.ts publish --packages-dir npm-packages --tag latest --provenance --verbose
