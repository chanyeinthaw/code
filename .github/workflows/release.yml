name: Release

# Pushing a stable version tag releases it. A manual run only builds artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version for a build-only run, independent of upstream tags
        type: string
        required: true
        default: 0.0.0

permissions:
  contents: read

concurrency:
  group: sora-release
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
      - name: Validate version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Use an exact stable version, such as v0.0.0.' >&2; exit 1; }
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  bundle:
    needs: [metadata, quality]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Install build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - name: Load T3 Connect public configuration
        run: cp .env.example .env
      - name: Set Sora version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"
      - name: Build shared JavaScript bundles
        env:
          SORA_TELEMETRY_CHANNEL: dev
        run: vp run build:desktop
      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error

  linux:
    needs: [metadata, bundle]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps
      - uses: ./.github/actions/release-build
        with:
          platform: linux
          arch: x64
          rust-target: x86_64-unknown-linux-gnu
          version: ${{ needs.metadata.outputs.version }}
      - name: Verify Linux CLI
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/smoke-cli-archive.ts --archive "release-cli/sora-$VERSION-linux-x64.tar.gz" --expect-version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-linux
          path: release-cli/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/latest*.yml
          if-no-files-found: error

  cross_build:
    needs: [metadata, bundle, linux]
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            rust-target: aarch64-apple-darwin
          - platform: win
            arch: x64
            rust-target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v8
        with:
          name: js-bundle
          path: apps
      - uses: actions/download-artifact@v8
        if: matrix.platform == 'win'
        with:
          name: cli-linux
          path: wsl-runtime
      - uses: ./.github/actions/release-build
        with:
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          rust-target: ${{ matrix.rust-target }}
          version: ${{ needs.metadata.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform == 'mac' && 'mac-unsigned' || 'desktop-win' }}
          path: |
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform == 'mac' && 'cli-mac-unsigned' || 'cli-win' }}
          path: release-cli/*
          if-no-files-found: error

  sign_mac:
    needs: [metadata, cross_build]
    runs-on: blacksmith-6vcpu-macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v8
        with:
          name: mac-unsigned
          path: mac-input
      - uses: actions/download-artifact@v8
        with:
          name: cli-mac-unsigned
          path: mac-input
      - name: Set packaging version
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$VERSION"
      - name: Ad hoc sign existing macOS binaries
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/finalize-macos-release.mjs
      - name: Verify signed CLI
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/smoke-cli-archive.ts --archive "release/sora-$VERSION-darwin-arm64.tar.gz" --expect-version "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: mac-signed
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.tar.gz
            release/latest-mac.yml
          if-no-files-found: error

  verify_windows:
    needs: [metadata, cross_build]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
      - uses: ./.github/actions/setup-ci-deps
      - uses: actions/download-artifact@v8
        with:
          name: cli-win
          path: release-cli
      - name: Verify cross-built CLI on Windows
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: node scripts/smoke-cli-archive.ts --archive "release-cli/sora-$VERSION-win32-x64.zip" --expect-version "$VERSION"

  publish:
    needs: [metadata, linux, sign_mac, verify_windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: cli-assets
      - uses: actions/download-artifact@v8
        with:
          name: mac-signed
          path: release
      - name: Publish Sora release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cp "cli-assets/sora-$VERSION-linux-x64.tar.gz" "cli-assets/sora-$VERSION-win32-x64.zip" release/
          cd release
          sha256sum sora-*.tar.gz sora-*.zip > SHA256SUMS
          gh release create "v$VERSION" --repo "$RELEASE_REPOSITORY" --verify-tag --title "Sora $VERSION" --notes "Sora $VERSION" --draft ./*
          gh release edit "v$VERSION" --repo "$RELEASE_REPOSITORY" --draft=false --latest

  publish_npm:
    needs: [metadata, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: false
      - uses: ./.github/actions/setup-ci-deps
      - name: Build and publish npm launcher
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          node scripts/build-npm-launcher.ts --version "$VERSION" --output-dir npm-packages
          node apps/server/scripts/cli.ts publish --packages-dir npm-packages --tag latest --provenance --verbose
